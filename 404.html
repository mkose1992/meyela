<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sayfa bulunamadı — Meyela</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .lost{min-height:100vh; display:grid; place-items:center; text-align:center; padding:40px var(--gutter)}
    .lost img.logo{width:180px; margin:0 auto 20px}
    .lost img.pic{width:min(360px,80vw); border-radius:50%; border:6px solid #fff; outline:4px solid var(--ink); margin:0 auto 24px}
    .lost h1{font-size:clamp(2rem,6vw,3.2rem); color:var(--roof)}
    .lost p{color:var(--ink-soft); font-size:1.15rem; margin:0 0 1.4em}
  </style>
</head>
<body>
  <main class="lost">
    <div>
      <img class="logo" src="/assets/img/logo.png" alt="Meyela">
      <img class="pic" src="/assets/img/karakter-misket.jpg" alt="Misket şaşkın şaşkın bakıyor">
      <h1>Hmm… burası boş!</h1>
      <p>Misket bu sayfayı bulamadı. Belki de kahvaltıyı yemeye gitti.</p>
      <a class="btn btn-clay" href="/">Ana sayfaya dön</a>
    </div>
  </main>
</body>
</html>
